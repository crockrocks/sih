version: "3.9"

services:

  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: interviewassist-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.0
    container_name: interviewassist-mlflow
    ports:
      - "5001:5000"
    command: >
      mlflow server
        --host 0.0.0.0
        --port 5000
        --backend-store-uri /mlflow/mlruns
        --default-artifact-root /mlflow/artifacts
    volumes:
      - mlflow_data:/mlflow
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  fastapi:
    build:
      context: ./interview/backend
      dockerfile: Dockerfile
    container_name: interviewassist-fastapi
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=${MONGO_URI}
      - GROQ_AI_KEY=${GROQ_AI_KEY}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    depends_on:
      qdrant:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    volumes:
      - ./interview/backend/uploads:/app/uploads
    restart: unless-stopped

volumes:
  qdrant_data:
  mlflow_data:
